  for(let k=0;k<6;k++){const c=cent(Math.floor(Math.random()*N));boom(c[0],c[1],col[S.winner],40,300);}
  shake=0.5;
}
function boom(x,y,color,n,size){
  if(S.parts.length>400)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,s=30+Math.random()*(size||150);
    S.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.5,max:0.9,color:color,r:1.5+Math.random()*2.5});
  }
}

/* ---------- OLAYLAR (yorum / beğeni / hediye) ---------- */
function handle(ev){
  if(ev&&ev.type==='stats'&&ev.data){stats=ev.data;saveStats();return;}
  if(ev&&ev.type==='config'){
    if(ev.roundSeconds){const v=parseInt(ev.roundSeconds,10);if(v>=30&&v<=3600){
      nextRoundTime=v;
      if(S&&S.state==='play'&&S.t>=ROUND_TIME-5){ROUND_TIME=v;S.t=v;} // tur yeni başladıysa hemen uygula
      const rs=document.getElementById('roundSel');if(rs){if(![...rs.options].some(o=>o.value===String(v))){const o=document.createElement('option');o.value=String(v);o.textContent=Math.round(v/60*10)/10+' dakika';rs.appendChild(o);}rs.value=String(v);}
    }}
    if(ev.hallEverySeconds!==undefined){const h=parseInt(ev.hallEverySeconds,10);if(h>=0){HALL_EVERY=h;hallGate=h;}}
    return;
  }
  if(ev&&ev.type==='showHall'){hallT=HALL_SHOW;return;}
  if(ev&&ev.type==='newRound'){newRound();return;}
  if(!S||S.state!=='play')return;
  const name=ev.user||'Biri';
  const u=getUser(name);
  if(ev.type==='chat'){
    const m=matchProv(ev.text||'');
    if(m>=0){
      if(u.prov!==m){
        u.prov=m;
        const c=cent(m);
        S.rings.push({x:c[0],y:c[1],t:0,color:'#ffffff'});
        S.pops.push({x:c[0],y:c[1],text:name.slice(0,10),t:0});
        addFeed(name+' → '+PROV[m][0]+' tarafında',col[S.owner[m]]);
      }
    }
    if(u.prov<0)return;
    const now=performance.now();
    if(now-u.last<1200)return;
    u.last=now;
    attack(S.owner[u.prov],DMG_CHAT);u.pts+=1;
  }else if(ev.type==='like'){
    if(u.prov<0)return;
    const n=Math.min(ev.count||1,10);
    for(let i=0;i<Math.ceil(n/3);i++)attack(S.owner[u.prov],DMG_LIKE*3);
    u.pts+=n*0.2;
  }else if(ev.type==='gift'){
    if(u.prov<0)u.prov=BIG[Math.floor(Math.random()*BIG.length)];
    const e=S.owner[u.prov];
    const coins=(ev.coins||1)*(ev.count||1);
    const gname=ev.giftName||'Hediye';
    const c=col[e];
    u.pts+=coins*2;
    if(coins>=500){
      addFeed('💥 '+name+' '+gname+' gönderdi! '+PROV[e][0]+' 6 il birden fethediyor!',c,true);
      for(let i=0;i<6;i++)setTimeout(()=>{if(S&&S.state==='play'&&S.owner[u.prov]!==undefined)attack(S.owner[u.prov],0,true);},i*280);
      shake=0.5;
    }else if(coins>=50){
      addFeed('💣 '+name+' '+gname+' ile 2 il fethetti! ('+PROV[e][0]+')',c,true);
      for(let i=0;i<2;i++)setTimeout(()=>{if(S&&S.state==='play')attack(S.owner[u.prov],0,true);},i*350);
    }else if(coins>=5){
      addFeed('🎁 '+name+' '+gname+' → '+PROV[e][0]+' güçlendi',c,true);
      for(let i=0;i<4;i++)attack(e,100);
    }else{
      addFeed('🌹 '+name+' '+gname+' → '+PROV[e][0],c);
      for(let i=0;i<Math.min(ev.count||1,5)*2;i++)attack(e,35);
    }
  }
}
window.CitySavas={handle:handle,step:function(dt){update(dt);}};

/* ---------- GÜNCELLE ---------- */
function update(dt){
  if(demo)botTick(dt);
  if(feedGate>0)feedGate-=dt;
  if(hallT>0)hallT-=dt;
  else if(HALL_EVERY>0&&S.state==='play'){
    hallGate-=dt;
    if(hallGate<=0){hallGate=HALL_EVERY;if(topPlayers(1).length)hallT=HALL_SHOW;}
  }
  if(S.state==='play'){
    S.t-=dt;
    if(S.t<=0){S.t=0;endRound();}
    // savunma yavaşça yenilenir
    for(let i=0;i<N;i++){if(S.def[i]<BASE_DEF)S.def[i]=Math.min(BASE_DEF,S.def[i]+dt*2);}
  }else{
    S.winT-=dt;
    if(S.winT<=0)newRound();
  }
  for(let i=0;i<N;i++)if(S.flash[i]>0)S.flash[i]-=dt;
  for(let i=S.beams.length-1;i>=0;i--){S.beams[i].t+=dt;if(S.beams[i].t>0.4)S.beams.splice(i,1);}
  for(let i=S.rings.length-1;i>=0;i--){S.rings[i].t+=dt;if(S.rings[i].t>0.8)S.rings.splice(i,1);}
  for(let i=S.pops.length-1;i>=0;i--){S.pops[i].t+=dt;if(S.pops[i].t>1.6)S.pops.splice(i,1);}
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i];p.life-=dt;if(p.life<=0){S.parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.95;p.vy*=0.95;
  }
  for(const f of feed)f.t-=dt;
  while(feed.length&&feed[0].t<=0)feed.shift();
  if(shake>0)shake-=dt;
}

/* ---------- SAHTE OYUNCULAR ---------- */
let botAcc=0;
function botTick(dt){
  if(S.state!=='play')return;
  botAcc+=dt;
  while(botAcc>0.15){
    botAcc-=0.15;
    const name=BOT_NAMES[Math.floor(Math.random()*BOT_NAMES.length)]+Math.floor(Math.random()*40);
    const r=Math.random();
    const prov=Math.random()<0.5?BIG[Math.floor(Math.random()*BIG.length)]-1:Math.floor(Math.random()*N);
    if(r<0.6){
      handle({type:'chat',user:name,text:Math.random()<0.5?PROV[prov][0]:String(prov+1)});
    }else if(r<0.93){
      const u=getUser(name);if(u.prov<0)u.prov=prov;
      handle({type:'like',user:name,count:3});
    }else if(r<0.985){
      const u=getUser(name);if(u.prov<0)u.prov=prov;
      handle({type:'gift',user:name,giftName:'Gül',coins:1});
    }else if(r<0.997){
      const u=getUser(name);if(u.prov<0)u.prov=prov;
      handle({type:'gift',user:name,giftName:'Hediye',coins:30});
    }else{
      const u=getUser(name);if(u.prov<0)u.prov=prov;
      handle({type:'gift',user:name,giftName:'Büyük hediye',coins:100});
    }
  }
}

/* ---------- ÇİZİM ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function txt(s,x,y,size,color,align,weight){
  s=String(s).replace(/\uFE0F/g,'');
  ctx.font=(weight||'700')+' '+size+'px system-ui,"Segoe UI",sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size/7);ctx.strokeStyle='rgba(0,0,0,0.75)';ctx.lineJoin='round';
  ctx.strokeText(s,x,y);ctx.fillStyle=color||'#fff';ctx.fillText(s,x,y);
}
function topSupporters(n){
  return Object.keys(users).map(k=>[k,users[k]]).filter(a=>a[1].pts>0).sort((a,b)=>b[1].pts-a[1].pts).slice(0,n);
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*12*shake*2,(Math.random()-0.5)*12*shake*2);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1330');g.addColorStop(1,'#1a0f2e');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);

  // başlık
  txt('MEMLEKET SAVAŞI',W/2,60,60,'#ffffff');
  txt('İLİNİ YAZ: ANKARA • 34 • İZMİR • 61 ...',W/2,116,25,'#ffd23f','center','600');
  const tp=S.state==='play'?S.t/ROUND_TIME:0;
  rr(60,146,600,24,12);ctx.fillStyle='#10131f';ctx.fill();
  if(tp>0){rr(60,146,Math.max(24,600*tp),24,12);ctx.fillStyle=tp>0.25?'#43d17a':'#ff5252';ctx.fill();}
  rr(60,146,600,24,12);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.stroke();
  txt(S.state==='play'?Math.ceil(S.t)+' sn':'Tur bitti',W/2,158,20,'#fff');
  // sağdan sola kayan kurallar
  ctx.save();
  rr(30,178,660,36,18);ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fill();ctx.clip();
  ctx.font='700 23px system-ui,"Segoe UI",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  if(!rulesW)rulesW=ctx.measureText(RULES).width;
  const mx=-((performance.now()/1000*RULE_SPEED)%rulesW);
  ctx.fillStyle='#ffe9a8';
  ctx.fillText(RULES,30+mx,197);
  ctx.fillText(RULES,30+mx+rulesW,197);
  ctx.restore();

  // harita
  ctx.save();
  ctx.translate(MAP_X,MAP_Y);
  ctx.lineJoin='round';
  for(let i=0;i<N;i++){
    ctx.fillStyle=col[S.owner[i]];
    ctx.fill(paths[i],'evenodd');
    if(S.def[i]<BASE_DEF-5){
      ctx.fillStyle='rgba(0,0,0,'+(0.55*(1-Math.max(0,S.def[i])/BASE_DEF)).toFixed(2)+')';
      ctx.fill(paths[i],'evenodd');
    }
    if(S.flash[i]>0){
      ctx.fillStyle='rgba(255,255,255,'+Math.min(0.9,S.flash[i]*3).toFixed(2)+')';
      ctx.fill(paths[i],'evenodd');
    }
  }
  ctx.lineWidth=0.8;ctx.strokeStyle='rgba(10,14,26,0.85)';
  for(let i=0;i<N;i++)ctx.stroke(paths[i]);
  ctx.restore();

  // imparatorluk adları (en büyük 4)
  const rk=ranking();
  for(let q=0;q<Math.min(4,rk.length);q++){
    const e=rk[q][0],n=rk[q][1];
    if(n<3)continue;
    let sx=0,sy=0,k=0;
    for(let i=0;i<N;i++)if(S.owner[i]===e){sx+=PROV[i][2];sy+=PROV[i][3];k++;}
    txt(PROV[e][0].toUpperCase(),MAP_X+sx/k,MAP_Y+sy/k,Math.min(26,12+n),'#ffffff');
  }

  // saldırı çizgileri
  for(const b of S.beams){
    const p=b.t/0.4;
    ctx.globalAlpha=1-p;
    ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(b.ax,b.ay);
    ctx.lineTo(b.ax+(b.bx-b.ax)*Math.min(1,p*2),b.ay+(b.by-b.ay)*Math.min(1,p*2));ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(const r of S.rings){
    const p=r.t/0.8;
    ctx.globalAlpha=1-p;ctx.strokeStyle=r.color;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(r.x,r.y,6+p*34,0,6.283);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(const p of S.parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of S.pops){
    ctx.globalAlpha=Math.max(0,1-p.t/1.6);
    txt(p.text,p.x,p.y-12-p.t*26,20,'#ffffff');
  }
  ctx.globalAlpha=1;

  // sıralama
  txt('🏆 İMPARATORLUK SIRALAMASI',W/2,566,32,'#ffd23f');
  const show=rk.slice(0,6);
  show.forEach((a,i)=>{
    const y=612+i*52,e=a[0],n=a[1];
    rr(40,y-20,640,42,10);ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fill();
    const w=Math.max(10,(640-4)*n/N);
    rr(40,y-20,w,42,10);ctx.fillStyle=col[e];ctx.globalAlpha=0.85;ctx.fill();ctx.globalAlpha=1;
    txt((i+1)+'.',64,y+1,26,'#fff','center');
    txt(PROV[e][0]+(provWins(e)>0?'  🏆'+provWins(e):''),96,y+1,26,'#fff','left');
    txt(n+' il',660,y+1,26,'#fff','right');
  });

  // kalıcı mini şeref bölümü (tüm zamanlar)
  rr(40,918,640,104,14);ctx.fillStyle='rgba(255,210,63,0.10)';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,210,63,0.45)';ctx.stroke();
  txt('👑 İMPARATORLAR (tüm zamanlar)',W/2,940,24,'#ffd23f');
  const tpl=topPlayers(3);
  if(tpl.length){
    tpl.forEach((a,i)=>txt(['🥇','🥈','🥉'][i]+' '+a[0].slice(0,9)+' ×'+a[1],120+i*240,986,24,'#fff'));
  }else txt('Henüz imparator yok — tahtı sen kap!',W/2,986,23,'#9fb0d0','center','500');

  // en iyi destekçiler (bu tur)
  txt('Bu turun en iyileri',W/2,1052,22,'#9fb0d0','center','600');
  const top=topSupporters(3);
  if(top.length){
    top.forEach((a,i)=>{
      const pv=a[1].prov>=0?col[S.owner[a[1].prov]]:'#fff';
      txt((i+1)+'. '+a[0].slice(0,10),120+i*240,1088,24,pv);
    });
  }else txt('Henüz kimse yok — ilk sen ol!',W/2,1088,22,'#9fb0d0','center','500');

  // akış
  feed.forEach((f,i)=>{
    ctx.globalAlpha=Math.min(1,f.t/1.5);
    txt(f.text.slice(0,50),W/2,1140+i*28,23,f.color,'center','600');
  });
  ctx.globalAlpha=1;
  ctx.restore();

  // kazanan ekranı
  if(S.state==='win'){
    ctx.fillStyle='rgba(0,0,0,0.74)';ctx.fillRect(0,0,W,H);
    const w=S.winner;
    txt('🏆 KAZANAN 🏆',W/2,360,66,'#ffd23f');
    txt(PROV[w][0].toUpperCase(),W/2,480,100,col[w]);
    txt('İMPARATORLUĞU',W/2,560,46,'#fff');
    txt(counts()[w]+' il fethetti',W/2,626,36,'#fff');
    txt('En çok destek verenler',W/2,740,34,'#fff');
    const med=['🥇','🥈','🥉'];
    topSupporters(3).forEach((a,i)=>txt(med[i]+' '+a[0].slice(0,14),W/2,806+i*62,40,a[1].prov>=0?col[S.owner[a[1].prov]]:'#fff'));
    if(S.champ)txt('👑 '+S.champ.name.slice(0,14)+' — '+S.champ.wins+'. kez imparator!',W/2,1010,34,'#ffd23f');
    txt('Yeni tur '+Math.max(0,Math.ceil(S.winT))+' sn sonra...',W/2,1080,30,'#9fb0d0','center','500');
  }
  // şeref salonu paneli
  if(hallT>0){
    const a=Math.min(1,hallT/0.5,(HALL_SHOW-hallT)/0.4+0.001);
    ctx.globalAlpha=Math.max(0,Math.min(1,a));
    ctx.fillStyle='rgba(6,8,20,0.97)';ctx.fillRect(0,0,W,H);
    txt('🏆 ŞEREF SALONU 🏆',W/2,90,62,'#ffd23f');
    txt('Toplam '+stats.rounds+' tur oynandı',W/2,150,24,'#9fb0d0','center','500');
    txt('👑 İMPARATORLAR (en çok tur birincisi)',W/2,215,32,'#fff');
    const tp10=topPlayers(10);
    tp10.forEach((p,i)=>{
      const y=272+i*50;
      rr(40,y-21,640,42,10);ctx.fillStyle=i<3?'rgba(255,210,63,0.16)':'rgba(255,255,255,0.06)';ctx.fill();
      txt((i+1)+'.',66,y+1,26,i<3?'#ffd23f':'#fff','center');
      txt(p[0].slice(0,16),100,y+1,27,'#fff','left');
      txt(p[1]+' kez',660,y+1,27,'#ffd23f','right');
    });
    if(!tp10.length)txt('Henüz kayıt yok',W/2,400,28,'#9fb0d0','center','500');
    txt('🌍 İL ŞAMPİYONLARI',W/2,830,32,'#fff');
    const tpv=topProvs(5);
    tpv.forEach((p,i)=>{
      const y=886+i*50;
      rr(40,y-21,640,42,10);ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fill();
      rr(40,y-21,10,42,5);ctx.fillStyle=col[p[0]];ctx.fill();
      txt((i+1)+'.',80,y+1,26,'#fff','center');
      txt(PROV[p[0]][0],112,y+1,27,'#fff','left');
      txt(p[1]+' kez',660,y+1,27,'#ffd23f','right');
    });
    ctx.globalAlpha=1;
  }
}

/* ---------- DÖNGÜ ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}

/* ---------- TEST PANELİ ---------- */
const sel=document.getElementById('sel');
PROV.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+' '+p[0];sel.appendChild(o);});
sel.value=5;
function ensure(){const u=getUser(me);if(u.prov<0||u.prov!==+sel.value)handle({type:'chat',user:me,text:String(+sel.value+1)});}
document.getElementById('joinBtn').onclick=()=>handle({type:'chat',user:me,text:String(+sel.value+1)});
document.querySelectorAll('[data-g]').forEach(b=>{
  b.onclick=()=>{ensure();const n=+b.dataset.g;
    handle({type:'gift',user:me,giftName:n>=1000?'Dev hediye':(n>=100?'Büyük hediye':(n>=20?'Orta hediye':'Gül')),coins:n});};
});
document.querySelectorAll('[data-l]').forEach(b=>{b.onclick=()=>{ensure();handle({type:'like',user:me,count:+b.dataset.l});};});
document.getElementById('botBtn').onclick=function(){demo=!demo;this.textContent='🤖 Sahte oyuncular: '+(demo?'açık':'kapalı');};
document.getElementById('newBtn').onclick=()=>newRound();
document.getElementById('hallBtn').onclick=()=>{hallT=HALL_SHOW;};
document.getElementById('resetBtn').onclick=()=>{stats={rounds:0,players:{},provs:{}};saveStats();};

if(!ROUND_CHOICES.includes(ROUND_TIME)){const o=document.createElement('option');o.value=String(ROUND_TIME);o.textContent=Math.round(ROUND_TIME/60*10)/10+' dakika';rsel.appendChild(o);}
rsel.value=String(ROUND_TIME);
rsel.onchange=()=>{nextRoundTime=parseInt(rsel.value,10);};
document.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')hallT=hallT>0?0:HALL_SHOW;});
if(!demo)document.getElementById('botBtn').textContent='🤖 Sahte oyuncular: kapalı';

/* ---------- TİKTOK BAĞLANTISI (sonra): ?ws=ws://adres:port ---------- */

  (function open(){

    try{ws=new WebSocket(wsUrl);}catch(e){return;}

  })();
}

newRound();
requestAnimationFrame(loop);
})();
