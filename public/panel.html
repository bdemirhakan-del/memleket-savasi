<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memleket Savaşı - Panel</title>
<style>
body{margin:0;background:#0b1030;color:#fff;font-family:system-ui,"Segoe UI",sans-serif;padding:18px;max-width:560px}
h1{font-size:22px;margin:0 0 14px;color:#ffd23f}
.k{background:#141a4a;border:1px solid #2c3a7a;border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:#9fb0d0;margin:10px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #33426b;background:#0b1030;color:#fff;font-size:16px}
button{padding:12px 16px;border-radius:10px;border:0;background:#ffd23f;color:#111;font-weight:700;font-size:16px;cursor:pointer;margin:6px 6px 0 0}
button.g{background:#1b2540;color:#fff;border:1px solid #33426b}
button.r{background:#ff5252;color:#fff}
.d{font-size:15px;line-height:1.7}
#msg{color:#43d17a;min-height:22px;margin-top:8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:5px 4px;border-bottom:1px solid #26306b}
</style></head><body>
<h1>Memleket Savaşı - Panel</h1>
<div class="k d" id="durum">Durum yükleniyor...</div>
<div class="k">
  <label>TikTok kullanıcı adı (başında @ olmadan)</label>
  <input id="kul" placeholder="kullaniciadi" autocomplete="off">
  <label>Tur süresi</label>
  <select id="sure">
    <option value="60">1 dakika</option><option value="120">2 dakika</option><option value="180">3 dakika</option>
    <option value="300">5 dakika</option><option value="600">10 dakika</option><option value="900">15 dakika</option>
  </select>
  <label>Şeref salonu ekranda kaç saniyede bir çıksın</label>
  <select id="salon">
    <option value="0">Kapalı (kendiliğinden çıkmasın)</option><option value="30">30 saniye</option><option value="60">60 saniye</option>
    <option value="75">75 saniye</option><option value="120">2 dakika</option><option value="300">5 dakika</option>
  </select>
  <button id="kaydet">Kaydet</button><div id="msg"></div>
</div>
<div class="k">
  <button class="g" data-k="salon">🏆 Şeref salonunu şimdi göster</button>
  <button class="g" data-k="yenitur">🔄 Yeni tur başlat</button>
  <button class="r" data-k="sifirla">🧹 Kayıtları sıfırla</button>
</div>
<div class="k"><b>İmparatorlar (tüm zamanlar)</b><table id="tab"></table></div>
<script>
const $=id=>document.getElementById(id);
function msg(t){$('msg').textContent=t;setTimeout(()=>{$('msg').textContent='';},3500);}
async function yukle(){
  const a=await (await fetch('/api/ayar')).json();
  $('kul').value=a.tiktokKullanici||'';
  const setSel=(el,v)=>{if(![...el.options].some(o=>o.value==v)){const o=document.createElement('option');o.value=v;o.textContent=v+' sn';el.appendChild(o);}el.value=String(v);};
  setSel($('sure'),a.turSuresiSaniye);setSel($('salon'),a.salonAralikSaniye);
}
async function durum(){
  try{
    const d=await (await fetch('/durum')).json();
    $('durum').innerHTML='TikTok: <b>'+d.tiktok+'</b><br>Açık oyun ekranı: <b>'+d.izleyiciSayisi+'</b><br>Oynanan tur: <b>'+d.tur+'</b>';
    const s=await (await fetch('/api/stats')).json();
    const l=Object.keys(s.players).map(k=>[k,s.players[k][0]]).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,10);
    $('tab').innerHTML=l.length?l.map((a,i)=>'<tr><td>'+(i+1)+'.</td><td>'+a[0].replace(/</g,'&lt;')+'</td><td style="text-align:right">'+a[1]+' kez</td></tr>').join(''):'<tr><td>Henüz kayıt yok</td></tr>';
  }catch(e){$('durum').textContent='Sunucuya ulaşılamıyor';}
}
$('kaydet').onclick=async()=>{
  await fetch('/api/ayar',{method:'POST',body:JSON.stringify({tiktokKullanici:$('kul').value,turSuresiSaniye:+$('sure').value,salonAralikSaniye:+$('salon').value})});
  msg('Kaydedildi. Oyuna birkaç saniyede geçer.');
};
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
  if(b.dataset.k==='sifirla'&&!confirm('Tüm imparator kayıtları silinecek. Emin misin?'))return;
  await fetch('/api/komut',{method:'POST',body:JSON.stringify({komut:b.dataset.k})});msg('Tamam.');durum();
});
yukle();durum();setInterval(durum,4000);
</script></body></html>
